    notes: "nginx rate limits are written; the API auth layer is being built."
    links:
      - docs/BUILD-PLAN.md
      - docs/compliance/access-control.md
      - docs/security/secure-sdlc.md

  - id: ACC-09
    title: Tenant isolation with row-level security
    description: "Every tenant table has ENABLE and FORCE ROW LEVEL SECURITY, and every request goes through one withTenant helper that sets app.tenant_id (unset means no rows). Isolation tests run in CI, and every restore test fails if a tenant data table lacks ENABLE and FORCE RLS."
    tsc: [CC6.1, C1.1]
    owner: Kelvin Waldner
    frequency: per-change
    evidence:
