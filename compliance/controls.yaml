  - id: ACC-08
    title: In-app authentication, tenant user access and API keys
    description: "Passwords use argon2id, TOTP MFA with recovery codes is required for owners, admins and HQ staff, every auth route is rate-limited with lockouts, session tokens are stored as sha-256 hashes, and cookie requests that change state need the Origin check and X-Fishtape header. Tenant owners and admins manage their users, crew devices and scoped, hashed, revocable API keys."
    tsc: [CC6.1, CC6.2, CC6.3, CC6.6]
    owner: Kelvin Waldner
    frequency: continuous
    evidence:
