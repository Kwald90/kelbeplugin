  - id: HRS-01
    title: Contractor onboarding
    description: "Before access, contractors sign an agreement covering confidentiality and acceptable use, turn on MFA, get a security briefing, and get least-privilege access (own branch, pull requests, no production). Background checks are not done; the compensating controls are no production access, review of every change and prompt removal of access."
    tsc: [CC1.1, CC1.4, CC1.5, CC2.2]
    owner: Kelvin Waldner
    frequency: on-event
    evidence:
      - "Signed contractor agreements (kept outside git)"
      - "Evidence bundle: access-review-<date>.md (collaborators, briefing dates)"
    status: partial
    notes: "Prepare an agreement template and briefing outline before the next contractor."
    links:
