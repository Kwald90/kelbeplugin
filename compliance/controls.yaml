    title: HQ console and BYPASSRLS access
    description: "HQ is served only on hq.fishtapehq.com (404 on app.), needs TOTP for HQ staff, and every HQ read of tenant data writes an audit event that is reviewed monthly. An IP allow-list is ready to enable."
