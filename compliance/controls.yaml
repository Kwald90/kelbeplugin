    notes: "Backup encryption is implemented in backup.sh. Disk encryption is unknown for both hosts; device encryption to confirm."
    links:
      - deploy/staging/backup.sh
      - docs/compliance/encryption.md
      - docs/compliance/asset-inventory.md

  - id: CRY-03
    title: Application-level encryption and hashing
    description: "Tenant integration secrets are encrypted with AES-256-GCM data keys wrapped by SECRETS_MASTER_KEY; passwords and PINs use argon2id; session tokens, device tokens and API keys are stored as sha-256 hashes."
    tsc: [CC6.1, C1.1]
    owner: Kelvin Waldner
