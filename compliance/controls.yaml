      - docs/security/secrets-management.md

  - id: CRY-04
    title: Key management and rotation
    description: "Every key has a custodian, storage place and rotation rule. .env files are root 600 and never in git, SECRETS_MASTER_KEY and age keys have two offline copies, and secrets are rotated each November and on suspected exposure."
    tsc: [CC6.1]
    owner: Kelvin Waldner
