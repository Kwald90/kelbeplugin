  - id: GOV-01
    title: Security and privacy policy set
    description: "Fifteen policies in docs/compliance/ set how Fishtape handles security, availability, confidentiality and privacy. Each names an owner, review cadence and controls, and is reviewed at least annually and after a SEV1/SEV2 or major change."
    tsc: [CC1.1, CC2.2, CC5.3]
    owner: Kelvin Waldner
    frequency: annually
    evidence:
      - "Review log table at the end of each policy in docs/compliance/"
      - "Git history of docs/compliance/"
      - "Evidence bundle: manifest.json"
    status: implemented
    notes: "First annual review due October 2027."
    links:
      - docs/compliance/README.md
      - docs/compliance/information-security.md

  - id: GOV-02
    title: Roles, authority and oversight
    description: "Kelvin Waldner is owner, security officer, privacy officer and incident commander, and the only approver of production changes; roles for contractors, AI agents and tenants are written down. With no board, Kelvin reviews the controls register quarterly with the access review, and a trusted backup contact holds sealed instructions."
    tsc: [CC1.2, CC1.3, CC2.2]
    owner: Kelvin Waldner
    frequency: quarterly
    evidence:
      - "docs/compliance/information-security.md roles table"
      - "Evidence bundle: controls-summary.json"
      - "Evidence bundle: access-review-<date>.md"
    status: partial
    notes: "Backup contact not named yet. No independent oversight; consider an annual review with an outside advisor once there are paying customers."
    links:
      - docs/compliance/information-security.md
      - docs/compliance/business-continuity.md

  - id: GOV-03
    title: Controls register and monthly evidence collection
    description: "This register maps each control to the Trust Services Criteria with frequency, evidence and status. The evidence collector runs monthly; bundles are zipped and kept encrypted outside git for 3 years."
    tsc: [CC2.1, CC4.1, CC5.1, CC5.2]
    owner: Kelvin Waldner
    frequency: monthly
    evidence:
