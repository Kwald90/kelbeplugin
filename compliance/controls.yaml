  - id: PRV-05
    title: Breach assessment, notification and records
    description: "Every breach is assessed for real risk of significant harm. Affected tenants are notified with a target of 72 hours from confirmation; for Fishtape's own data the OPC, the Alberta commissioner or the CAI and the people affected are notified as the law requires; every breach is recorded and the record kept 3 years."
