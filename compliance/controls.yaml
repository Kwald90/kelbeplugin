      - docs/compliance/acceptable-use.md

  - id: HRS-02
    title: Contractor offboarding within 24 hours
    description: "All contractor access is removed within 24 hours of the end of an engagement, secrets they could have seen are rotated, and written confirmation that data was returned or deleted is kept."
    tsc: [CC1.5, CC6.2, CC6.3]
    owner: Kelvin Waldner
    frequency: on-event
