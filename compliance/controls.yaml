  # ---------------------------------------------------------------- encryption (CC6.1, CC6.7)

  - id: CRY-01
    title: Encryption in transit
    description: "Public traffic uses TLS 1.2 or 1.3 with ECDHE AEAD ciphers, HTTP redirects to HTTPS, HSTS is one year with includeSubDomains, certificates come from Let's Encrypt with automatic renewal, and a CAA record allows only Let's Encrypt."
    tsc: [CC6.1, CC6.7]
    owner: Kelvin Waldner
    frequency: continuous
    evidence:
      - "deploy/production/nginx/fishtape.conf"
      - "deploy/production/nginx/security-headers.conf and deploy/staging/security-headers.conf"
      - "host-status.json certificate daysLeft"
      - "TLS scan output saved at the annual review"
    status: partial
    notes: "Production config written, host not built. Staging TLS protocols are set by CloudPanel and need confirming."
    links:
      - docs/compliance/encryption.md
      - docs/security/headers-csp.md

  - id: CRY-02
    title: Encryption at rest for backups, hosts and devices
    description: "Backups are encrypted with age to public keys whose private halves stay offline (production adds a sealed spare). Host disks use provider encryption or LUKS, and devices use full-disk encryption."
    tsc: [CC6.1, CC6.7, A1.2]
    owner: Kelvin Waldner
    frequency: continuous
    evidence:
      - "Evidence bundle: last-backup-<env>.json (encryption field)"
      - "Evidence bundle: check-host-production.json (disk-encryption)"
