# Fishtape controls register.
#
# One entry per control: what it is, which Trust Services Criteria it supports, how often it runs,
# where the evidence comes from, and whether it is in place. Policies live in docs/compliance/;
# each policy lists its controls in the table at the top. Evidence is collected monthly with
#   node compliance/evidence/collect.mjs
# into compliance/evidence/out/<YYYY-MM-DD>/ (gitignored), then zipped and stored encrypted outside
# git for 3 years.
#
# Status is honest: "implemented" means in place and working now; "partial" means some of it exists
# (often the script or workflow) but setup on a server or in GitHub, or the API, is still missing;
# "planned" means not started. Update the status in the same commit as the change that moves it.
#
# This repository is public. Keep descriptions free of secrets and of details that would help an attacker.

version: 1
framework: "AICPA Trust Services Criteria (2017, revised points of focus 2022)"
owner: Kelvin Waldner
last_reviewed: "2026-10-19"

scope:
  system: "Fishtape, a multi-tenant SaaS for Canadian electrical contractors: the PWA, the iOS wrapper, the API and worker, PostgreSQL, the HQ console, the status endpoint, the staging and production hosts, and the GitHub repository with its CI/CD."
  categories: [Security, Availability, Confidentiality, Processing Integrity (light), Privacy (light)]
  environments: [local, staging, production]
  out_of_scope:
    - "The old WordPress plugin on branch main (includes/, kelbe-project-tracker.php, replica/)."
    - "Tenants' own accounts with Stripe, Twilio, Resend, Meta and Anthropic (shared responsibility, see docs/compliance/vendor-management.md)."
    - "Physical security of data centres, which is inherited from the hosting providers."
  notes:
    - "SOC 2-aligned controls with evidence. No SOC 2 audit and no certification is claimed."
    - "One-person company. Where a control needs more than one person, the compensating control is described (CHG-07, HRS-01, GOV-02)."
    - "Production is not built yet and the API is being built, so many controls are partial or planned."

statuses: [implemented, partial, planned]
frequencies: [continuous, per-change, daily, weekly, monthly, quarterly, annually, on-event]

controls:

