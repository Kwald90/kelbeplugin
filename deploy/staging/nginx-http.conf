# Fishtape staging, http-level nginx settings. install-nginx.sh copies this to
# /etc/nginx/snippets/fishtape-staging-http.conf; the CloudPanel vhost includes it once, at the
# top of the file, outside any server block (README.md, "Edit the vhost").

# Referer without its query string (or fragment).
map $http_referer $fishtape_staging_referer {
    "~^(?<fishtape_staging_ref>[^?#]*)" $fishtape_staging_ref;
    default "";
}

# Access log format for /api/: the path without $args, so tokens, emails or search terms that
# ever end up in a query string are not written to disk. Used by fishtape-staging-site.conf.
log_format fishtape_staging_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                                    '$status $body_bytes_sent "$fishtape_staging_referer" "$http_user_agent" '
                                    '$request_time $request_id';
