# Fishtape staging, http-level nginx settings. install-nginx.sh copies this to
# /etc/nginx/snippets/fishtape-staging-http.conf; the CloudPanel vhost includes it once, at the
# top of the file, outside any server block (README.md, "Edit the vhost").

# Per-address rate limits for /api/ and the sign-in routes (the API limits and locks out too;
# this is the outer layer). Used by fishtape-staging-site.conf.
limit_req_zone $binary_remote_addr zone=fishtape_staging_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=fishtape_staging_auth:10m rate=10r/m;

# Provider webhooks (/api/v1/webhooks/<provider>/...): limited per provider path, not per address.
# Intuit (QuickBooks) and the other senders post from a few shared addresses, which the per-address
# /api/ zone would throttle; every body is signature-checked by the API anyway.
map $uri $fishtape_staging_webhook_key {
    # Known senders only: any other path shares the one "other" bucket, so made-up segments
    # cannot each get their own 50 r/s or churn the zone.
    "~^/api/v1/webhooks/(?<fishtape_staging_wh>qbo|stripe|platform-stripe|twilio|sendgrid|facebook)(/|$)" $fishtape_staging_wh;
    default "other";
}
limit_req_zone $fishtape_staging_webhook_key zone=fishtape_staging_webhooks:1m rate=50r/s;

# Referer without its query string (or fragment).
map $http_referer $fishtape_staging_referer {
    "~^(?<fishtape_staging_ref>[^?#]*)" $fishtape_staging_ref;
    default "";
}

# Access log format for /api/: the path without $args, so tokens, emails or search terms that
# ever end up in a query string are not written to disk. Used by fishtape-staging-site.conf.
log_format fishtape_staging_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                                    '$status $body_bytes_sent "$fishtape_staging_referer" "$http_user_agent" '
                                    '$request_time $request_id';
