# Fishtape security headers, staging. Install as /etc/nginx/snippets/fishtape-staging-headers.conf
# (README.md, step 5). Included at server level and again in any location that has its own
# add_header, because nginx drops inherited add_header lines in such locations.
#
# The CSP must match deploy/production/nginx/security-headers.conf. CI checks both against the
# app (.github/scripts/check-csp.mjs). Reasoning for each directive: docs/security/headers-csp.md.
#
#   script-src / connect-src  'self' only: pdf.js is self-hosted in vendor/pdfjs-<version>/;
#                             sw.js only handles same-origin requests and skips /api/.
#   style-src-attr            one hash: the inline style on #boot in index.html. Styles set
#                             from JS go through CSSOM (ui.js h()), which CSP does not block.
#   worker-src blob:          pdf.js wraps its cross-origin worker in a blob: URL.
#   img-src data: blob:       drawing thumbnails and plan underlays are data: URLs.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), xr-spatial-tracking=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), geolocation=(self), fullscreen=(self), screen-wake-lock=(self), clipboard-write=(self), microphone=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=(), browsing-topics=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-hashes' 'sha256-EcJt9BR7RzlCkX1VP+89sqJ3ShKTcSMgu49NQP6XlIU='; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
