# Reference only. Roughly what the live CloudPanel vhost
#   /etc/nginx/sites-enabled/tgelectrical.truecollarbuilt.com.conf
# should look like after the README's "Edit the vhost" step. Compare it with the live file
# (diff -u); don't copy it over the live file, which has CloudPanel's own lines in it.

server {
    listen 80;
    listen [::]:80;
    server_name tgelectrical.truecollarbuilt.com;

    # Let's Encrypt (certbot --webroot -w /var/www/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tgelectrical.truecollarbuilt.com;

    ssl_certificate     /etc/letsencrypt/live/tgelectrical.truecollarbuilt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tgelectrical.truecollarbuilt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:fishtape_staging_tls:10m;
    ssl_session_tickets off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Everything Fishtape: static app, /api/ proxy, /hq/, caching and security headers.
    # Installed by deploy/staging/install-nginx.sh from nginx-api.conf.snippet.
    include /etc/nginx/snippets/fishtape-staging-site.conf;
}
