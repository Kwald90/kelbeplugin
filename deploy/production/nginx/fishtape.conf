# Fishtape production sites: app.fishtapehq.com, hq.fishtapehq.com, status.fishtapehq.com.
# Installed as /etc/nginx/sites-available/fishtape.conf (+ sites-enabled link) by install-nginx.sh.
# Needs /etc/nginx/snippets/fishtape-headers.conf and fishtape-proxy.conf (same script) and one
# Let's Encrypt certificate named "fishtape" covering all three names (README.md, "TLS").
#
# Static files come from /srv/fishtape/www/current, a symlink update.sh flips per release.

# ---- http context ----
limit_req_zone $binary_remote_addr zone=fishtape_api:10m rate=20r/s;
# Sign-in, MFA, PIN and password-reset routes. The API rate-limits and locks out as well; this
# is the outer layer. Adjust the location prefix below if the API's auth routes move.
limit_req_zone $binary_remote_addr zone=fishtape_auth:10m rate=10r/m;
limit_req_status 429;

upstream fishtape_api {
    server 127.0.0.1:3410;
    keepalive 16;
}

# ---- port 80: ACME challenges, everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name app.fishtapehq.com hq.fishtapehq.com status.fishtapehq.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- unknown hosts and bare-IP requests: close the connection ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# ---- app.fishtapehq.com: the PWA and the tenant API ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.fishtapehq.com;
    server_tokens off;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/fishtape/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fishtape/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:fishtape_tls:10m;
    ssl_session_tickets off;

    root /srv/fishtape/www/current/electrical-app;
    index index.html;
    include /etc/nginx/snippets/fishtape-headers.conf;

    client_max_body_size 25m;
    client_body_timeout 30s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # HQ lives on hq.fishtapehq.com only.
    location ^~ /api/hq/ { return 404; }
    location ^~ /hq/ { return 404; }
    # No API docs UI in production (the OpenAPI JSON stays available for API-key users).
    location ^~ /api/docs { return 404; }
    location ^~ /api/documentation { return 404; }

    location ^~ /api/v1/auth/ {
        limit_req zone=fishtape_auth burst=20 nodelay;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location ^~ /api/ {
        limit_req zone=fishtape_api burst=60 nodelay;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }

    location ~ /\.(?!well-known/) { return 404; }
    location = /sw.js { expires epoch; try_files $uri =404; }
    location = /index.html { expires epoch; }
    location = /manifest.webmanifest { default_type application/manifest+json; expires epoch; }
    location ~* \.(?:js|mjs|css|json)$ { expires epoch; try_files $uri =404; }
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ { expires 30d; try_files $uri =404; }
    location ^~ /vendor/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; expires epoch; }
}

# ---- hq.fishtapehq.com: HQ console and its API (BYPASSRLS role behind /api/hq/) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hq.fishtapehq.com;
    server_tokens off;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/fishtape/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fishtape/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:fishtape_tls:10m;
    ssl_session_tickets off;

    root /srv/fishtape/www/current/hq;
    index index.html;
    include /etc/nginx/snippets/fishtape-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Optional, recommended once HQ staff have fixed addresses: allow-list them here.
    # include /etc/nginx/snippets/fishtape-hq-allow.conf;   # allow 203.0.113.10; deny all;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location ^~ /api/docs { return 404; }
    location ^~ /api/documentation { return 404; }
    location ^~ /api/v1/auth/ {
        limit_req zone=fishtape_auth burst=20 nodelay;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location ^~ /api/ {
        limit_req zone=fishtape_api burst=60 nodelay;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }

    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(?:js|mjs|css|json)$ { expires epoch; try_files $uri =404; }
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ { expires 30d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; expires epoch; }
}

# ---- status.fishtapehq.com: public status only ----
# A status page on the same box goes down with it. Prefer an external status service with a
# CNAME here (docs/architecture/environments.md); this block is the fallback.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.fishtapehq.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/fishtape/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fishtape/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:fishtape_tls:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/fishtape-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location = /api/v1/status {
        limit_req zone=fishtape_api burst=20 nodelay;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location = /api/healthz {
        limit_req zone=fishtape_api burst=20 nodelay;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location = / { return 302 /api/v1/status; }
    location / { return 404; }
}
