# Fishtape production sites on the shared CloudPanel box (208.113.210.97):
#   fishtapehq.com          public marketing site (allow-list; the PWA is not served here)
#   www.fishtapehq.com      301 to the apex
#   app.fishtapehq.com      the PWA and the tenant API
#   hq.fishtapehq.com       the HQ console; its API calls go to hq-api
#   status.fishtapehq.com   the public status page
# Installed as /etc/nginx/sites-available/fishtape-production.conf, enabled through the link
# /etc/nginx/sites-enabled/zz-fishtape-production.conf (install-nginx.sh), with the snippets
# fishtape-{headers,proxy,deny,tls}.conf in /etc/nginx/snippets/. One Let's Encrypt certificate
# named "fishtape" covers every name that resolves to this box (issue-cert.sh).
#
# Shared-box rules. Other sites' vhosts live in the same nginx, so this file:
#   - has no default_server and no catch-all server: unknown names stay with whatever the box
#     already does. The link name sorts last ("zz-") so no Fishtape server becomes nginx's
#     implicit default for a port either.
#   - sets nothing at http level except uniquely named zones, a map, a log format and two
#     upstreams (all fishtape_*; staging uses fishtape_staging_*). limit_req_status is set per
#     server, not globally, so other sites keep their own rate-limit status.
#   - talks to the production containers only: api 127.0.0.1:3420, hq-api 127.0.0.1:3421
#     (staging owns 3410/3411, the host's Postgres 5432, something else 3000).
#
# Static files come from /srv/fishtape/www/current, a symlink update.sh flips per release. A
# release holds electrical-app/, hq/ and site/ only; secrets live in
# /srv/fishtape/repo/deploy/production/.env, which nginx can't reach. Every host serves an
# allow-list and answers 404 for everything else. deploy/check-exposure.sh verifies it after
# every deploy (--production, --hq, --marketing, --status).

# ---- http context (names unique to production) ----
limit_req_zone $binary_remote_addr zone=fishtape_api:10m rate=20r/s;
# Sign-in, MFA, PIN and password-reset routes. The API rate-limits and locks out as well; this
# is the outer layer. Adjust the location prefix below if the API's auth routes move.
limit_req_zone $binary_remote_addr zone=fishtape_auth:10m rate=10r/m;
# Public forms on the marketing site (the Enterprise "Let's talk" form). The API also limits
# leads per address per hour.
limit_req_zone $binary_remote_addr zone=fishtape_public:10m rate=30r/m;

# Access logs without query strings, and Referer without its query: tokens, emails or search
# terms that ever land in a URL are not written to disk. Kept 30 days (logrotate-nginx).
map $http_referer $fishtape_referer {
    "~^(?<fishtape_ref>[^?#]*)" $fishtape_ref;
    default "";
}
log_format fishtape_noquery '$remote_addr [$time_local] $host "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent "$fishtape_referer" "$http_user_agent" '
                            '$request_time $request_id';

# Tenant API (no BYPASSRLS credential) and HQ API (the only holder of the fishtape_hq role).
upstream fishtape_api {
    server 127.0.0.1:3420;
    keepalive 16;
}
upstream fishtape_hq_api {
    server 127.0.0.1:3421;
    keepalive 4;
}

# ---- port 80: ACME challenges, everything else to HTTPS on the same name ----
server {
    listen 80;
    listen [::]:80;
    server_name fishtapehq.com www.fishtapehq.com app.fishtapehq.com hq.fishtapehq.com status.fishtapehq.com;
    server_tokens off;
    access_log /var/log/fishtape-production/nginx-access.log fishtape_noquery;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- fishtapehq.com: the public marketing site ----
# Allow-list: the site pages (site/), the app assets they import (read-only from the release's
# electrical-app/), hero media, and the few API routes public pages and Stripe need.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fishtapehq.com;
    server_tokens off;
    autoindex off;
    charset utf-8;
    include /etc/nginx/snippets/fishtape-tls.conf;
    access_log /var/log/fishtape-production/nginx-access.log fishtape_noquery;
    error_log /var/log/fishtape-production/nginx-error.log warn;
    limit_req_status 429;

    root /srv/fishtape/www/current/site;
    # Same headers and CSP as the app (it already allows media-src 'self' for the hero videos).
    include /etc/nginx/snippets/fishtape-headers.conf;

    client_max_body_size 1m;    # static only; the proxied routes allow 72m (fishtape-proxy.conf)

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    # RFC 9116 security contact. Renew Expires every year (compliance calendar).
    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: https://github.com/Kwald90/kelbeplugin/security/advisories/new\nExpires: 2027-10-19T00:00:00Z\nPolicy: https://github.com/Kwald90/kelbeplugin/security/policy\nPreferred-Languages: en, fr\nCanonical: https://fishtapehq.com/.well-known/security.txt\n";
    }

    # ---- API: only what public pages and Stripe need; the rest of /api/ is 404 here ----
    location ^~ /api/v1/public/ {
        limit_req zone=fishtape_public burst=10 nodelay;
        proxy_pass http://fishtape_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location = /api/v1/status {
        limit_req zone=fishtape_api burst=20 nodelay;
        proxy_pass http://fishtape_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    # Fishtape's own Stripe account (subscriptions). Signature-checked by the API.
    location = /api/v1/webhooks/platform-stripe {
        limit_req zone=fishtape_api burst=60 nodelay;
        proxy_pass http://fishtape_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location ^~ /api/ { return 404; }

    # The PWA lives on app. The status page is /status here and status.fishtapehq.com.
    location = /index.html { return 301 https://app.fishtapehq.com/; }

    # Never served (dotfiles, repo folders, secrets/dumps/keys/archives by name). Regex
    # locations match in file order, so these come before the asset regexes below.
    include /etc/nginx/snippets/fishtape-deny.conf;

    # ---- pages: clean URLs, each one file under site/ (site/site-lib.js fileForPath) ----
    #   /                      index.html            /features             features/index.html
    #   /pricing, /signup, /about, /services, /status, /terms, /privacy   <name>.html
    #   /features/<slug>       features/<slug>.html  /for/<slug>           for/<slug>.html
    # A slug is lower-case letters, digits and single dashes; anything else is 404.
    location = / { try_files /index.html /pricing.html =404; expires epoch; }
    location ~ ^/(pricing|signup|about|services|status|terms|privacy)$ { try_files /$1.html =404; expires epoch; }
    location = /features { try_files /features/index.html =404; expires epoch; }
    location ~ "^/(features|for)/([a-z0-9]+(?:-[a-z0-9]+)*)$" { try_files /$1/$2.html =404; expires epoch; }
    # Exact matches win over the deny list's *.txt / *.xml rules.
    location = /robots.txt { try_files /robots.txt =404; expires 1d; }
    location = /sitemap.xml { default_type application/xml; try_files /sitemap.xml =404; expires 1d; }
    location ^~ /site/ {
        root /srv/fishtape/www/current;
        expires epoch;
        location ~ /\. { return 404; }
        # Old /site/*.html addresses (links in promotions, bookmarks) go to the clean URL.
        location = /site/index.html { return 301 /$is_args$args; }
        location = /site/features/index.html { return 301 /features$is_args$args; }
        location ~ "^/site/(pricing|signup|about|services|status|terms|privacy)\.html$" { return 301 /$1$is_args$args; }
        location ~ "^/site/(features|for)/([a-z0-9]+(?:-[a-z0-9]+)*)\.html$" { return 301 /$1/$2$is_args$args; }
        location ~* \.(?:html|js|mjs|css)$ { try_files $uri =404; }
        location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ { expires 30d; try_files $uri =404; }
        location = /site/ { return 302 /; }
        return 404;
    }

    # ---- app assets the pages import, read-only from the release's electrical-app/ ----
    location ~* ^/(?:js|css|vendor)/.+\.(?:js|mjs|css|json)$ {
        root /srv/fishtape/www/current/electrical-app;
        expires epoch;
        try_files $uri =404;
    }
    location ~* ^/(?:icons|css)/.+\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        root /srv/fishtape/www/current/electrical-app;
        expires 30d;
        try_files $uri =404;
    }

    # ---- hero videos and images: /var/lib/fishtape-production/media (not part of a release) ----
    # Only plain names (letters, digits, . _ -, no leading dot) with a media extension. Cached
    # 30 days: give a changed file a new name (hero-2026-11.mp4) instead of overwriting it.
    location ^~ /media/ {
        root /var/lib/fishtape-production;
        disable_symlinks on from=$document_root;
        location ~* ^/media/(?:[a-z0-9_-][a-z0-9._-]*/)*[a-z0-9_-][a-z0-9._-]*\.(?:mp4|webm|jpe?g|png|webp)$ {
            expires 30d;
            try_files $uri =404;
        }
        return 404;
    }

    location / { return 404; }
}

# ---- www.fishtapehq.com: to the apex ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fishtapehq.com;
    server_tokens off;
    include /etc/nginx/snippets/fishtape-tls.conf;
    access_log /var/log/fishtape-production/nginx-access.log fishtape_noquery;
    error_log /var/log/fishtape-production/nginx-error.log warn;
    include /etc/nginx/snippets/fishtape-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://fishtapehq.com$request_uri;
    }
}

# ---- app.fishtapehq.com: the PWA and the tenant API ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.fishtapehq.com;
    server_tokens off;
    autoindex off;
    charset utf-8;
    include /etc/nginx/snippets/fishtape-tls.conf;
    access_log /var/log/fishtape-production/nginx-access.log fishtape_noquery;
    error_log /var/log/fishtape-production/nginx-error.log warn;
    limit_req_status 429;

    root /srv/fishtape/www/current/electrical-app;
    index index.html;
    include /etc/nginx/snippets/fishtape-headers.conf;

    client_max_body_size 1m;    # static only; /api/ allows 72m (fishtape-proxy.conf)

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    # RFC 9116 security contact. Renew Expires every year (compliance calendar).
    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: https://github.com/Kwald90/kelbeplugin/security/advisories/new\nExpires: 2027-10-19T00:00:00Z\nPolicy: https://github.com/Kwald90/kelbeplugin/security/policy\nPreferred-Languages: en, fr\nCanonical: https://app.fishtapehq.com/.well-known/security.txt\n";
    }

    # HQ lives on hq.fishtapehq.com only.
    location ^~ /api/hq/ { return 404; }
    location ^~ /hq/ { return 404; }
    # No API docs UI in production (the OpenAPI JSON stays available for API-key users).
    location ^~ /api/docs { return 404; }
    location ^~ /api/documentation { return 404; }

    location ^~ /api/v1/auth/ {
        limit_req zone=fishtape_auth burst=20 nodelay;
        proxy_pass http://fishtape_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location ^~ /api/ {
        limit_req zone=fishtape_api burst=60 nodelay;
        proxy_pass http://fishtape_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }

    # Never served (dotfiles, repo folders, secrets/dumps/keys/archives by name).
    include /etc/nginx/snippets/fishtape-deny.conf;

    # The allow-list.
    location = / { try_files /index.html =404; expires epoch; }
    location = /index.html { expires epoch; }
    location = /sw.js { expires epoch; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; expires epoch; }
    location ~* \.(?:js|mjs|css|json)$ { expires epoch; try_files $uri =404; }
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ { expires 30d; try_files $uri =404; }
    location ^~ /vendor/ {
        location ~ /\. { return 404; }
        expires 1y;
        try_files $uri =404;
    }
    location / { return 404; }
}

# ---- hq.fishtapehq.com: HQ console; its API calls go to hq-api (the BYPASSRLS role) ----
# Loads fine before hq. has DNS or a certificate name; issue-cert.sh adds it once it resolves.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hq.fishtapehq.com;
    server_tokens off;
    autoindex off;
    charset utf-8;
    include /etc/nginx/snippets/fishtape-tls.conf;
    access_log /var/log/fishtape-production/nginx-access.log fishtape_noquery;
    error_log /var/log/fishtape-production/nginx-error.log warn;
    limit_req_status 429;

    # The console is hq/ of the release, served under /hq/ (its index.html asks for /hq/js/app.js,
    # /hq/hq.css ...), and it imports the app's shared UI kit, styles and icons (/js/, /css/,
    # /icons/, /vendor/) read-only from electrical-app/, like the marketing site does. Nothing else
    # of electrical-app/ is served here: no PWA index.html, sw.js or manifest (the PWA's worker
    # would take over this origin). Every location sets its own root; this one answers nothing.
    root /srv/fishtape/www/current/hq;
    index index.html;
    include /etc/nginx/snippets/fishtape-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Optional, recommended once HQ staff have fixed addresses: allow-list them here.
    # include /etc/nginx/snippets/fishtape-hq-allow.conf;   # allow 203.0.113.10; deny all;

    client_max_body_size 1m;    # static only; /api/ allows 72m (fishtape-proxy.conf)

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    # hq-api runs the same code as the tenant API, so only what the HQ console needs reaches it:
    # sign-in/MFA/session, the HQ endpoints and health. Every other /api/ path is 404 here, so a
    # bug in a tenant route can't be reached through the process that holds BYPASSRLS.
    location ^~ /api/v1/auth/ {
        limit_req zone=fishtape_auth burst=20 nodelay;
        proxy_pass http://fishtape_hq_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location ^~ /api/hq/ {
        limit_req zone=fishtape_api burst=60 nodelay;
        proxy_pass http://fishtape_hq_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location = /api/healthz {
        proxy_pass http://fishtape_hq_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location = /api/v1/status {
        limit_req zone=fishtape_api burst=20 nodelay;
        proxy_pass http://fishtape_hq_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location ^~ /api/ { return 404; }

    # The PWA is on app.; never its worker or manifest here.
    location = /sw.js { return 404; }
    location = /manifest.webmanifest { return 404; }

    # Never served (dotfiles, repo folders, secrets/dumps/keys/archives by name). Regex
    # locations match in file order, so these come before the asset regexes below.
    include /etc/nginx/snippets/fishtape-deny.conf;

    # ---- the console: / is hq/index.html; /hq/ holds its scripts, styles and worker ----
    location = / { root /srv/fishtape/www/current/hq; try_files /index.html =404; expires epoch; }
    location = /index.html { return 301 /; }
    location ^~ /hq/ {
        root /srv/fishtape/www/current;
        expires epoch;
        # ^~ skips the regex deny list, so repeat what matters for this folder.
        location ~ /\. { return 404; }
        location ~* \.(?:md|txt|map|sh|ya?ml|json\.bak|bak|old|orig|swp|tmp|log)$ { return 404; }
        location = /hq/ { return 302 /; }
        location = /hq/index.html { return 302 /; }
        location ~* ^/hq/.+\.(?:js|mjs|css|json)$ { try_files $uri =404; }
        location ~* ^/hq/.+\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ { expires 30d; try_files $uri =404; }
        return 404;
    }

    # ---- shared app assets HQ imports, read-only from the release's electrical-app/ ----
    location ~* ^/(?:js|css|vendor)/.+\.(?:js|mjs|css|json)$ {
        root /srv/fishtape/www/current/electrical-app;
        expires epoch;
        try_files $uri =404;
    }
    location ~* ^/(?:icons|css|vendor)/.+\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        root /srv/fishtape/www/current/electrical-app;
        expires 30d;
        try_files $uri =404;
    }

    location / { return 404; }
}

# ---- status.fishtapehq.com: the public status page (site/status.html) ----
# A status page on the same box goes down with it. Prefer an external status service with a
# CNAME here before launch (docs/architecture/environments.md); this block is the fallback.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.fishtapehq.com;
    server_tokens off;
    autoindex off;
    charset utf-8;
    include /etc/nginx/snippets/fishtape-tls.conf;
    access_log /var/log/fishtape-production/nginx-access.log fishtape_noquery;
    error_log /var/log/fishtape-production/nginx-error.log warn;
    limit_req_status 429;

    root /srv/fishtape/www/current/site;
    include /etc/nginx/snippets/fishtape-headers.conf;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: https://github.com/Kwald90/kelbeplugin/security/advisories/new\nExpires: 2027-10-19T00:00:00Z\nPolicy: https://github.com/Kwald90/kelbeplugin/security/policy\nPreferred-Languages: en, fr\nCanonical: https://status.fishtapehq.com/.well-known/security.txt\n";
    }

    # What status.js calls. All public; none carries tenant data. /api/v1/public/status is the
    # page's data (components, 90-day uptime, notices); .../status/{subscribe,confirm,unsubscribe}
    # are the optional email notices (off unless HQ turns them on).
    location ^~ /api/v1/public/status {
        limit_req zone=fishtape_public burst=20 nodelay;
        proxy_pass http://fishtape_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location = /api/v1/status {
        limit_req zone=fishtape_api burst=20 nodelay;
        proxy_pass http://fishtape_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location = /api/readyz {
        limit_req zone=fishtape_api burst=20 nodelay;
        proxy_pass http://fishtape_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location = /api/healthz {
        limit_req zone=fishtape_api burst=20 nodelay;
        proxy_pass http://fishtape_api;
        include /etc/nginx/snippets/fishtape-proxy.conf;
    }
    location ^~ /api/ { return 404; }

    # The page and exactly the files it loads.
    location = / { try_files /status.html =404; expires epoch; }
    location = /site/status.html { return 301 /; }
    location = /status { return 301 /; }
    location ~ "^/site/(?:status|status-lib|site|site-lib|app-link)\.js$" { root /srv/fishtape/www/current; expires epoch; try_files $uri =404; }
    location = /site/site.css { root /srv/fishtape/www/current; expires epoch; try_files $uri =404; }
    location = /css/tokens.css { root /srv/fishtape/www/current/electrical-app; expires epoch; try_files $uri =404; }
    location = /js/brand.js { root /srv/fishtape/www/current/electrical-app; expires epoch; try_files $uri =404; }
    location = /icons/icon.svg { root /srv/fishtape/www/current/electrical-app; expires 30d; try_files $uri =404; }
    # The rest of the site lives on the apex (site.js also points the links there).
    location = /site/pricing.html { return 301 https://fishtapehq.com/pricing; }
    location ~ "^/(?:pricing|signup|about|services|terms|privacy|features)$" { return 301 https://fishtapehq.com$request_uri; }
    location ~ "^/(?:features|for)/[a-z0-9]+(?:-[a-z0-9]+)*$" { return 301 https://fishtapehq.com$request_uri; }
    location / { return 404; }
}
