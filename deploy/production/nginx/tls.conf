# TLS for the Fishtape production hosts. Installed as /etc/nginx/snippets/fishtape-tls.conf.
# One Let's Encrypt certificate ("fishtape") covers app., hq. and status.fishtapehq.com.
# Mozilla "intermediate" profile. No OCSP stapling: Let's Encrypt stopped running OCSP in 2025.
ssl_certificate     /etc/letsencrypt/live/fishtape/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/fishtape/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:fishtape_tls:10m;
ssl_session_tickets off;
