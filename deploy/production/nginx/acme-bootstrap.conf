# First-time only: lets certbot issue the "fishtape" certificate by webroot before
# fishtape.conf (which needs that certificate) can load. README.md, steps 6-7.
# install-nginx.sh --acme-bootstrap enables it as sites-enabled/zz-fishtape-acme.conf;
# the full install removes it.
#
# Shared box: no default_server, names only, so other sites are untouched. Every other path
# on these names is 404 until the full config is in.
server {
    listen 80;
    listen [::]:80;
    server_name fishtapehq.com www.fishtapehq.com app.fishtapehq.com hq.fishtapehq.com status.fishtapehq.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}
