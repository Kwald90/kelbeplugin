# First-time only: lets certbot issue the "fishtape" certificate by webroot before fishtape.conf
# (which needs that certificate) can load. README.md, "TLS". Remove it once fishtape.conf is in.
server {
    listen 80;
    listen [::]:80;
    server_name app.fishtapehq.com hq.fishtapehq.com status.fishtapehq.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}
