# Fishtape security headers, production. Installed as /etc/nginx/snippets/fishtape-headers.conf
# by install-nginx.sh. Included at server level in fishtape.conf. A location with its own
# add_header loses these (nginx inheritance rule), which is why the /api/ locations use
# fishtape-proxy.conf, which repeats the transport headers.
#
# The CSP must match deploy/staging/security-headers.conf; CI checks both against the app
# (.github/scripts/check-csp.mjs). Directive-by-directive reasoning: docs/security/headers-csp.md.
# HSTS has no `preload`: add it only once every fishtapehq.com subdomain serves HTTPS, and
# serve HSTS on the apex too (docs/security/headers-csp.md).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), xr-spatial-tracking=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), geolocation=(self), fullscreen=(self), screen-wake-lock=(self), clipboard-write=(self), microphone=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=(), browsing-topics=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-hashes' 'sha256-EcJt9BR7RzlCkX1VP+89sqJ3ShKTcSMgu49NQP6XlIU='; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
