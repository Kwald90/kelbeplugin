# Fishtape API proxy settings, shared by every /api/ location. Each location sets its own
# upstream (api on 127.0.0.1:3410, hq-api on 127.0.0.1:3411) and then includes this file.
# Production: /etc/nginx/snippets/fishtape-proxy.conf. Staging: fishtape-staging-proxy.conf.
# deploy/staging/nginx-proxy.conf and deploy/production/nginx/proxy.conf are identical (CI checks).
# Drawings and wire-run photos travel as data URLs inside records for now; the API's own limit
# is the largest record plus 8 MB (server/src/app.js SYNC_BODY_LIMIT).
client_max_body_size 72m;
client_body_timeout 60s;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# nginx is the edge: overwrite, never append, so clients can't forge their address.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
# Never replay a request on another attempt: a retried POST could double-write.
proxy_next_upstream off;
# API answers may hold customer data: never stored by the browser or any cache.
proxy_hide_header Cache-Control;
proxy_hide_header X-Powered-By;
add_header Cache-Control "no-store" always;
# nginx is the one source of the transport headers below; the API's copies (helmet) are dropped
# so no response carries two conflicting values. The API's own CSP (default-src 'none'), CORP and
# COOP pass through. These add_header lines replace the server-level ones in this location.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
