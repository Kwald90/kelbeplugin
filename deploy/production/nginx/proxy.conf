# Fishtape API proxy settings. Installed as /etc/nginx/snippets/fishtape-proxy.conf and included
# inside each /api/ location of fishtape.conf.
proxy_pass http://fishtape_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# nginx is the edge: overwrite, never append, so clients can't forge their address.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
# Never replay a request on another attempt: a retried POST could double-write.
proxy_next_upstream off;
# API answers may hold customer data: never stored by the browser or any cache.
proxy_hide_header Cache-Control;
proxy_hide_header X-Powered-By;
add_header Cache-Control "no-store" always;
# These add_header lines replace the server-level ones in this location, so repeat the transport
# headers. The API sets its own CSP for anything HTML it serves.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
