# nginx site for Kelbe Circuit at TGelectrical.truecollarbuilt.com
# Installed by deploy/setup-vps.sh. certbot adds the HTTPS (443) block.
server {
    listen 80;
    listen [::]:80;
    server_name tgelectrical.truecollarbuilt.com;

    root /var/www/tgelectrical/current/electrical-app;
    index index.html;

    # The service worker must always be fresh so app updates reach devices.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|svg|png|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing but the app folder is served.
    location ~ /\. { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
