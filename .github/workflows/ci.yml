# CI: web tests, CSP guard, deploy-config checks and (once server/ exists) server tests against
# Postgres 17, a Docker build and a container smoke test. A push to the staging branch that
# passes everything deploys to staging (deploy-staging.yml, off until STAGING_DEPLOY_ENABLED).
# deploy-production.yml calls this workflow again for release tags.
#
# Branch protection: require the "CI passed" check (job ci-ok).
# Third-party actions are pinned to full commit SHAs; Dependabot keeps them current.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a push run: it may be about to deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      server: ${{ steps.check.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            server/package.json
          sparse-checkout-cone-mode: false
      - id: check
        # The server job is skipped (not failed) until workstream A lands server/.
        run: echo "server=${{ hashFiles('server/package.json') != '' }}" >> "$GITHUB_OUTPUT"

  web:
    name: Web app tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test electrical-app/tests/*.test.mjs
      - name: CSP guard
        run: node .github/scripts/check-csp.mjs

  infra:
    name: Deploy config checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      NGINX_IMAGE: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No .env files, private keys, dumps or keystores in the tree
        run: node .github/scripts/check-committed-files.mjs

      - name: Server image ships every PWA file the server imports
        run: |
          status=0
          for p in $(grep -rhE "(import|new URL\()" server/src | grep -oE "electrical-app/js/[A-Za-z0-9_./-]+" | sort -u); do
            if ! grep -q "^COPY ${p%/}/\?\s" server/Dockerfile; then
              echo "::error file=server/Dockerfile::server/src uses $p but the Dockerfile doesn't COPY it"; status=1
            fi
            if ! grep -qx "!${p%/}/\?" .dockerignore; then
              echo "::error file=.dockerignore::server/src uses $p but .dockerignore doesn't allow it (!$p)"; status=1
            fi
          done
          exit "$status"

      - name: Shared deploy scripts are identical in staging and production
        run: |
          status=0
          for f in backup.sh restore-test.sh init-env.sh host-status.sh initdb/10-bootstrap.sh; do
            if ! cmp -s "deploy/staging/$f" "deploy/production/$f"; then
              echo "::error file=deploy/production/$f::differs from deploy/staging/$f (keep the copies identical)"
              status=1
            fi
          done
          if ! cmp -s deploy/staging/nginx-proxy.conf deploy/production/nginx/proxy.conf; then
            echo "::error file=deploy/production/nginx/proxy.conf::differs from deploy/staging/nginx-proxy.conf"
            status=1
          fi
          exit "$status"

      - name: Scripts are executable
        run: |
          status=0
          while IFS= read -r f; do
            mode="$(git ls-files -s -- "$f" | cut -d' ' -f1)"
            if [ "$mode" != 100755 ]; then echo "::error file=$f::not executable in git (git update-index --chmod=+x $f)"; status=1; fi
          done < <(git ls-files 'deploy/*.sh' 'deploy/staging/*.sh' 'deploy/production/*.sh')
          exit "$status"

      - name: shellcheck
        run: |
          shellcheck --version | head -2
          shellcheck -x -S style deploy/check-exposure.sh deploy/staging/*.sh deploy/staging/initdb/*.sh deploy/production/*.sh deploy/production/initdb/*.sh

      - name: actionlint
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tgz

      - name: docker compose config
        run: |
          for env in staging production; do
            cp "deploy/$env/.env.example" "deploy/$env/.env"
            sed -i -E 's/^(POSTGRES_SUPERUSER_PASSWORD|FISHTAPE_OWNER_PASSWORD|FISHTAPE_APP_PASSWORD|FISHTAPE_HQ_PASSWORD)=$/\1=ci0000/' "deploy/$env/.env"
            IMAGE_TAG=ci docker compose -f "deploy/$env/docker-compose.yml" config --quiet
            IMAGE_TAG=ci docker compose -f "deploy/$env/docker-compose.yml" --profile tools config --services | sort | tr '\n' ' '
            echo " <- $env services"
            rm -f "deploy/$env/.env"
          done

      - name: nginx -t (production config and staging vhost)
        run: |
          t="$(mktemp -d)"
          mkdir -p "$t/le/live/fishtape" "$t/le/live/tgelectrical.truecollarbuilt.com" "$t/snippets" "$t/sites" "$t/log-prod" "$t/log-staging"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout "$t/le/live/fishtape/privkey.pem" -out "$t/le/live/fishtape/fullchain.pem" 2>/dev/null
          cp "$t"/le/live/fishtape/*.pem "$t/le/live/tgelectrical.truecollarbuilt.com/"
          cp deploy/production/nginx/security-headers.conf "$t/snippets/fishtape-headers.conf"
          cp deploy/production/nginx/proxy.conf "$t/snippets/fishtape-proxy.conf"
          cp deploy/production/nginx/deny.conf "$t/snippets/fishtape-deny.conf"
          cp deploy/production/nginx/tls.conf "$t/snippets/fishtape-tls.conf"
          cp deploy/staging/nginx-http.conf "$t/snippets/fishtape-staging-http.conf"
          cp deploy/staging/security-headers.conf "$t/snippets/fishtape-staging-headers.conf"
          cp deploy/staging/nginx-proxy.conf "$t/snippets/fishtape-staging-proxy.conf"
          cp deploy/staging/nginx-api.conf.snippet "$t/snippets/fishtape-staging-site.conf"
          cp deploy/production/nginx/fishtape.conf deploy/staging/vhost.example.conf "$t/sites/"
          printf 'events {}\nhttp {\n  include /etc/nginx/mime.types;\n  include /etc/nginx/sites/*.conf;\n}\n' > "$t/nginx.conf"
          chmod -R a+rwX "$t"
          docker run --rm \
            -v "$t/nginx.conf:/etc/nginx/nginx.conf:ro" -v "$t/snippets:/etc/nginx/snippets:ro" \
            -v "$t/sites:/etc/nginx/sites:ro" -v "$t/le:/etc/letsencrypt:ro" \
            -v "$t/log-prod:/var/log/fishtape-production" -v "$t/log-staging:/var/log/fishtape-staging" \
            "$NGINX_IMAGE" nginx -t
          # The first-run ACME config on its own.
          rm "$t"/sites/*.conf
          cp deploy/production/nginx/acme-bootstrap.conf "$t/sites/"
          docker run --rm -v "$t/nginx.conf:/etc/nginx/nginx.conf:ro" -v "$t/sites:/etc/nginx/sites:ro" "$NGINX_IMAGE" nginx -t

  server:
    name: Server tests
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway credentials for the CI database only.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # The test suites create one database per test file, so they need a superuser URL. With
      # the role passwords set, tests log in as fishtape_owner/app/hq for real (no SET ROLE).
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_OWNER_PASSWORD: ci_owner
      TEST_APP_PASSWORD: ci_app
      TEST_HQ_PASSWORD: ci_hq
      # For the migrate step and the image smoke test (the `fishtape` database from bootstrap.sql).
      DATABASE_URL: postgres://fishtape_app:ci_app@127.0.0.1:5432/fishtape
      MIGRATE_DATABASE_URL: postgres://fishtape_owner:ci_owner@127.0.0.1:5432/fishtape
      HQ_DATABASE_URL: postgres://fishtape_hq:ci_hq@127.0.0.1:5432/fishtape
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Bootstrap roles and database (server/db/bootstrap.sql)
        run: |
          psql -v ON_ERROR_STOP=1 --no-psqlrc -d postgres \
            -v owner_password=ci_owner -v app_password=ci_app -v hq_password=ci_hq \
            -f server/db/bootstrap.sql

      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Test (against the Postgres service; DB suites must not be skipped)
        working-directory: server
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/server-test.log"
          if grep -q 'TEST_DATABASE_URL is not set' "$RUNNER_TEMP/server-test.log"; then
            echo "::error::database test suites were skipped; TEST_DATABASE_URL did not reach the tests"
            exit 1
          fi

      - name: Migrate the fishtape database (for the image smoke test)
        working-directory: server
        run: npm run migrate

      - name: Build the image
        run: docker build -f server/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t fishtape.invalid/server:ci .

      - name: Smoke test the image (same hardening as compose)
        run: |
          # APP_ENV=staging so the deployed-mode config checks run (real master key, no superuser).
          SECRETS_MASTER_KEY="$(openssl rand -base64 32)"
          export SECRETS_MASTER_KEY
          docker run -d --name fishtape-api --network host --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -e APP_ENV=staging -e PORT=3410 -e HOST=127.0.0.1 -e DATABASE_URL -e HQ_DATABASE_URL \
            -e PUBLIC_ORIGIN=http://127.0.0.1:3410 -e SECRETS_MASTER_KEY -e LOG_LEVEL=warn \
            fishtape.invalid/server:ci
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3410/api/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3410/api/healthz && echo
          curl -fsS http://127.0.0.1:3410/api/readyz && echo
          status="$(curl -fsS http://127.0.0.1:3410/api/v1/status)"
          echo "$status"
          case "$status" in *"${GITHUB_SHA:0:12}"*) ;; *) echo "::error::/api/v1/status does not report this commit"; exit 1 ;; esac
          if [ "$(docker exec fishtape-api id -u)" = 0 ]; then echo "::error::container runs as root"; exit 1; fi
          owner="$(docker exec fishtape-api stat -c %U /app/server/src/index.js)"
          if [ "$owner" != root ]; then echo "::error::app code is owned by '$owner', not root"; exit 1; fi

      - name: Container logs
        if: always()
        run: docker logs fishtape-api 2>&1 | tail -n 200 || true

  ci-ok:
    name: CI passed
    if: always()
    needs: [web, infra, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed (server may be skipped until it exists)
        env:
          WEB: ${{ needs.web.result }}
          INFRA: ${{ needs.infra.result }}
          SERVER: ${{ needs.server.result }}
        run: |
          echo "web=$WEB infra=$INFRA server=$SERVER"
          [ "$WEB" = success ] && [ "$INFRA" = success ] && { [ "$SERVER" = success ] || [ "$SERVER" = skipped ]; }

  deploy-staging:
    name: Deploy staging
    needs: ci-ok
    if: >-
      !cancelled()
      && needs.ci-ok.result == 'success'
      && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', vars.STAGING_BRANCH || 'claude/electrical-concept-app-h4qz12')
      && vars.STAGING_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
